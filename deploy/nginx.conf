# nginx reverse proxy for the CGZSA website.
#
# Use this only if your organisation already standardises on nginx. Caddy
# (deploy/Caddyfile) is the recommended path because it handles certificates
# without a separate certbot renewal that can silently stop working.
#
# Install:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cgzsa
#   sudo nano /etc/nginx/sites-available/cgzsa      # replace cgzsa.org
#   sudo ln -s /etc/nginx/sites-available/cgzsa /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cgzsa.org -d www.cgzsa.org
#
# certbot rewrites this file to add the certificate paths and the port 443
# server block. Run it after the HTTP-only version below is working, not before.

upstream cgzsa_app {
    # The application binds to loopback only; nothing outside this host can
    # reach it except through nginx.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name cgzsa.org www.cgzsa.org;

    # certbot replaces this with a redirect to HTTPS once the certificate
    # exists. Until then, leave it serving so the ACME challenge can complete.
    location / {
        proxy_pass http://cgzsa_app;
        include /etc/nginx/proxy_params;

        # X-Forwarded-For must APPEND the real client address rather than
        # replace the header. $proxy_add_x_forwarded_for does this; writing
        # $remote_addr alone would discard the chain and break the app's
        # trusted-proxy counting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Server-sent events for live chat. Without these three lines nginx buffers
    # the stream and a staff reply never reaches the visitor — the connection
    # stays open and silent, which is the most confusing possible failure.
    location /api/chat/stream {
        proxy_pass http://cgzsa_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Uploaded media is immutable and safe to cache hard at the edge.
    location /api/media/ {
        proxy_pass http://cgzsa_app;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
    }

    # Security headers. The application sets these too; these cover responses
    # nginx produces itself, such as its own error pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Uncomment only once HTTPS is working — sending HSTS over plain HTTP, or
    # before the certificate is right, locks browsers out of the site.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 30M;   # the app caps documents at 25 MB
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
